<!DOCTYPE html>
<html lang="ja"><head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="冷蔵庫内の調味料と食材の在庫を管理するページ" /><title>綿谷家｜冷蔵庫管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="style.css" />
</head><body>
  <main class="page-shell"><header class="site-header"><p class="eyebrow">✦ REFRIGERATOR STOCK</p><h1>綿谷家の冷蔵庫</h1><p class="subtitle">冷蔵庫の在庫を、かんたんに管理</p></header>
    <section class="inventory" aria-labelledby="inventory-title"><div class="inventory-heading"><div><p class="section-kicker">INVENTORY LIST</p><h2 id="inventory-title">冷蔵庫管理リスト</h2></div><p class="item-summary"><span id="total-count">0</span> 品を管理中</p></div><div class="list-grid" id="category-lists" aria-live="polite"><p class="loading-message">在庫を読み込んでいます…</p></div></section>
  </main>
  <dialog class="item-dialog" id="item-dialog" aria-labelledby="dialog-title"><form id="item-form"><div class="dialog-heading"><h2 id="dialog-title">在庫を追加</h2><button class="close-button" type="button" id="close-dialog" aria-label="閉じる">×</button></div><input type="hidden" id="category-code" name="categoryCode" /><label>名前<input id="item-name" name="name" maxlength="100" required autocomplete="off" /></label><div class="form-row"><label>個数<input id="item-quantity" name="quantity" type="number" min="0" value="1" required /></label><label>単位<input id="item-unit" name="unit" maxlength="20" value="個" required /></label></div><label>アイコン（任意）<input id="item-emoji" name="emoji" maxlength="32" placeholder="例: 🥬" /></label><p class="form-error" id="form-error" role="alert"></p><button class="submit-button" type="submit">追加する</button></form></dialog>
  <p class="toast" id="toast" role="status" aria-live="polite"></p><script src="script.js"></script>
</body></html>
