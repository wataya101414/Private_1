<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="冷蔵庫内の調味料と食材の在庫を管理するページ"
    />
    <title>綿谷家｜冷蔵庫管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <p class="eyebrow"><span aria-hidden="true">✦</span> REFRIGERATOR STOCK</p>
        <h1>綿谷家の冷蔵庫</h1>
        <p class="subtitle">冷蔵庫の在庫を、かんたんに管理</p>
      </header>

      <section class="inventory" aria-labelledby="inventory-title">
        <div class="inventory-heading">
          <div>
            <p class="section-kicker">INVENTORY LIST</p>
            <h2 id="inventory-title">冷蔵庫管理リスト</h2>
          </div>
          <p class="item-summary"><span id="total-count">4</span> 品を管理中</p>
        </div>

        <div class="list-grid">
          <section class="inventory-group condiment-group" aria-labelledby="condiment-title">
            <div class="group-heading">
              <div class="group-icon" aria-hidden="true">♨</div>
              <div>
                <p class="group-label">SEASONING</p>
                <h3 id="condiment-title">調味料リスト</h3>
              </div>
            </div>

            <ul class="item-list" aria-label="調味料">
              <li class="stock-item" data-count="1">
                <span class="item-emoji" aria-hidden="true">🥚</span>
                <span class="item-name">マヨネーズ</span>
                <div class="quantity-control" aria-label="マヨネーズの個数">
                  <button class="quantity-button" type="button" data-action="decrease" aria-label="マヨネーズを1個減らす">−</button>
                  <output class="quantity" aria-label="マヨネーズの個数">1</output><span class="unit">個</span>
                  <button class="quantity-button" type="button" data-action="increase" aria-label="マヨネーズを1個増やす">＋</button>
                </div>
              </li>
              <li class="stock-item" data-count="2">
                <span class="item-emoji" aria-hidden="true">🧂</span>
                <span class="item-name">焼肉のたれ</span>
                <div class="quantity-control" aria-label="焼肉のたれの個数">
                  <button class="quantity-button" type="button" data-action="decrease" aria-label="焼肉のたれを1個減らす">−</button>
                  <output class="quantity" aria-label="焼肉のたれの個数">2</output><span class="unit">本</span>
                  <button class="quantity-button" type="button" data-action="increase" aria-label="焼肉のたれを1個増やす">＋</button>
                </div>
              </li>
            </ul>

            <button class="add-button" type="button" data-category="調味料">
              <span aria-hidden="true">＋</span> 調味料を追加
            </button>
          </section>

          <section class="inventory-group food-group" aria-labelledby="food-title">
            <div class="group-heading">
              <div class="group-icon" aria-hidden="true">♧</div>
              <div>
                <p class="group-label">FOOD</p>
                <h3 id="food-title">食材リスト</h3>
              </div>
            </div>

            <ul class="item-list" aria-label="食材">
              <li class="stock-item" data-count="2">
                <span class="item-emoji" aria-hidden="true">🫘</span>
                <span class="item-name">納豆</span>
                <div class="quantity-control" aria-label="納豆の個数">
                  <button class="quantity-button" type="button" data-action="decrease" aria-label="納豆を1個減らす">−</button>
                  <output class="quantity" aria-label="納豆の個数">2</output><span class="unit">個</span>
                  <button class="quantity-button" type="button" data-action="increase" aria-label="納豆を1個増やす">＋</button>
                </div>
              </li>
              <li class="stock-item" data-count="1">
                <span class="item-emoji" aria-hidden="true">🥛</span>
                <span class="item-name">牛乳</span>
                <div class="quantity-control" aria-label="牛乳の個数">
                  <button class="quantity-button" type="button" data-action="decrease" aria-label="牛乳を1個減らす">−</button>
                  <output class="quantity" aria-label="牛乳の個数">1</output><span class="unit">本</span>
                  <button class="quantity-button" type="button" data-action="increase" aria-label="牛乳を1個増やす">＋</button>
                </div>
              </li>
            </ul>

            <button class="add-button" type="button" data-category="食材">
              <span aria-hidden="true">＋</span> 食材を追加
            </button>
          </section>
        </div>
      </section>
    </main>

    <p class="toast" id="toast" role="status" aria-live="polite"></p>
    <script src="script.js"></script>
  </body>
</html>
